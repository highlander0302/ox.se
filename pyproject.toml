[project]
name = "ox-se"
version = "1.2"
description = "This is an anki decks-cards generator scripts that I user for Swedish language learning."
authors = [
    {name = "highlander0302"}
]
license = {text = "if you can use it, use it"}
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "genanki (>=0.13.1,<0.14.0)"
]

[tool.poetry]
packages = [{include = "ox"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
